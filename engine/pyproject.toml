[project]
name = "ultimatum-engine"
version = "0.10.0"
description = "Universal AI domain-expert requirement & estimation engine"
requires-python = ">=3.10"
dependencies = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "pydantic>=2.6", "anthropic>=0.40"]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
ultimatum = "ultimatum.cli:main"

[tool.setuptools.packages.find]
include = ["ultimatum*"]
